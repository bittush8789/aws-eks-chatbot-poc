apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-chatbot
  namespace: default
  labels:
    app: streamlit-chatbot
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streamlit-chatbot
  template:
    metadata:
      labels:
        app: streamlit-chatbot
    spec:
      containers:
        - name: streamlit-chatbot
          # Replace placeholder with your actual ECR image URL:
          # e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com/eks-streamlit-chatbot:latest
          image: REPLACE_WITH_ECR_IMAGE_URL
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: APP_TITLE
              value: "AWS EKS Q&A Chatbot"
            - name: APP_ENV
              value: "production"
            # Optional Kubernetes Secret for GROQ_API_KEY (can also be entered via UI sidebar)
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chatbot-secrets
                  key: groq-api-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
